services:
  db:
    image: postgres:16-alpine
    container_name: enrollment-db
    environment:
      POSTGRES_USER: enrollment
      POSTGRES_PASSWORD: enrollment
      POSTGRES_DB: enrollment
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enrollment -d enrollment"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    container_name: enrollment-api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://enrollment:enrollment@db:5432/enrollment?schema=public
      CORS_ORIGIN: http://localhost:8080,http://localhost:5173
      JWT_SECRET: local-docker-secret-change-me-at-least-32-chars
      JWT_EXPIRES_IN_SECONDS: 3600
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: http://localhost:3000
    container_name: enrollment-web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
